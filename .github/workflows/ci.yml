name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify generated contracts and type safety
        run: npm run check
      - run: npm test
      - run: npm run release:check
